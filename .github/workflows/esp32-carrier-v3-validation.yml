name: Validate ESP32 carrier v3

on:
  pull_request:
    paths:
      - 'fixtures/esp32_robot_carrier/**'
      - 'scripts/generate-esp32-carrier-v3-production.mjs'
      - 'scripts/finalize-esp32-carrier-v3.mjs'
      - 'scripts/route-esp32-carrier-v3-*.mjs'
      - 'scripts/add-esp32-carrier-v3-battery-sense.mjs'
      - 'scripts/apply-esp32-carrier-v3-hand-solder.mjs'
      - 'scripts/finalize-esp32-carrier-v3-hand-solder.mjs'
      - 'scripts/refine-esp32-carrier-v3-hand-solder-drc.mjs'
      - 'scripts/fix-esp32-carrier-hand-solder-transform.mjs'
      - 'scripts/inspect-esp32-carrier-v3-final.mjs'
      - 'scripts/export-esp32-carrier-v3-*.mjs'
      - 'scripts/validate-esp32-carrier-v3-*.mjs'
      - '.github/workflows/esp32-carrier-v3-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Repair hand-solder transform source if needed
        run: node scripts/fix-esp32-carrier-hand-solder-transform.mjs

      - name: Generate electrically validated final carrier
        run: node scripts/add-esp32-carrier-v3-battery-sense.mjs

      - name: Inspect final carrier geometry
        run: node scripts/inspect-esp32-carrier-v3-final.mjs

      - name: Validate final electrical and system contract before package substitutions
        run: |
          node scripts/validate-esp32-carrier-v3-battery-sense.mjs
          node scripts/validate-esp32-carrier-v3-routing.mjs
          node scripts/validate-esp32-carrier-v3-system.mjs

      - name: Apply hand-solder production transform
        run: |
          node scripts/apply-esp32-carrier-v3-hand-solder.mjs --existing
          node scripts/finalize-esp32-carrier-v3-hand-solder.mjs

      - name: Validate package-conversion contract
        run: node scripts/validate-esp32-carrier-v3-hand-solder.mjs

      - name: Refine hand-solder layout for native DRC
        run: |
          node scripts/refine-esp32-carrier-v3-hand-solder-drc.mjs
          node scripts/export-esp32-carrier-v3-cpl.mjs fixtures/esp32_robot_carrier/esp32_robot_carrier_v3.kicad_pcb
          node scripts/validate-esp32-carrier-v3-hand-solder-refined.mjs

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y kicad

      - name: Parse, refill zones, and run KiCad DRC
        run: |
          set -uo pipefail
          mkdir -p artifacts
          BOARD=fixtures/esp32_robot_carrier/esp32_robot_carrier_v3.kicad_pcb
          kicad-cli pcb drc --refill-zones --save-board --severity-all --all-track-errors --format json --output artifacts/drc.json "$BOARD" || true
          kicad-cli pcb drc --refill-zones --severity-all --all-track-errors --output artifacts/drc.rpt "$BOARD" || true
          node scripts/validate-esp32-carrier-v3-drc.mjs artifacts/drc.json
          node scripts/sync-esp32-carrier-v3-b64.mjs
          node scripts/export-esp32-carrier-v3-cpl.mjs "$BOARD"
          node scripts/validate-esp32-carrier-v3-hand-solder-refined.mjs "$BOARD"
          cp "$BOARD" artifacts/esp32_robot_carrier_v3.kicad_pcb
          cp artifacts/drc.json artifacts/drc.rpt fixtures/esp32_robot_carrier/fabrication_v3/

      - name: Generate and validate final fabrication package
        run: node scripts/export-esp32-carrier-v3-fabrication.mjs

      - name: Preserve validation artifacts
        run: |
          cp fixtures/esp32_robot_carrier/fabrication_v3/esp32_robot_carrier_v3-gerbers.zip artifacts/
          cp fixtures/esp32_robot_carrier/fabrication_v3/board-stats.json artifacts/
          cp fixtures/esp32_robot_carrier/fabrication_v3/renderings/front.svg artifacts/
          cp fixtures/esp32_robot_carrier/fabrication_v3/renderings/back.svg artifacts/
          cp fixtures/esp32_robot_carrier/fabrication_v3/renderings/top.png artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-carrier-v3-hand-solder-production
          path: artifacts
          if-no-files-found: error

      - name: Commit validated generated production files to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/apply-esp32-carrier-v3-hand-solder.mjs \
            fixtures/esp32_robot_carrier/BOM_JLCPCB.csv \
            fixtures/esp32_robot_carrier/CPL_JLCPCB.csv \
            fixtures/esp32_robot_carrier/esp32_robot_carrier_v3.kicad_pcb \
            fixtures/esp32_robot_carrier/esp32_robot_carrier_v3.kicad_pcb.gz.b64 \
            fixtures/esp32_robot_carrier/fabrication_v3
          if git diff --cached --quiet; then
            echo "Generated production files are already current."
          else
            git commit -m "build: refresh hand-solder carrier fabrication"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

name: Validate ESP32 carrier PCB v2

on:
  push:
    paths:
      - 'fixtures/esp32_robot_carrier/**'
      - 'scripts/validate-esp32-carrier-v2.mjs'
      - '.github/workflows/esp32-carrier-validation-v2.yml'
  pull_request:
    paths:
      - 'fixtures/esp32_robot_carrier/**'
      - 'scripts/validate-esp32-carrier-v2.mjs'
      - '.github/workflows/esp32-carrier-validation-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact carrier PCB fixture
        shell: bash
        run: |
          set -euo pipefail
          base64 -d fixtures/esp32_robot_carrier/esp32_robot_carrier_v2.kicad_pcb.gz.b64 | gunzip > fixtures/esp32_robot_carrier/esp32_robot_carrier_v2.kicad_pcb
          echo 'd76be0c4625d4a34c3e5a09d863da20c15aa4491002270aa1ff017080ce78dda  fixtures/esp32_robot_carrier/esp32_robot_carrier_v2.kicad_pcb' | sha256sum -c -
          test "$(wc -c < fixtures/esp32_robot_carrier/esp32_robot_carrier_v2.kicad_pcb)" -gt 70000

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install KiCanvas dependencies
        run: npm ci

      - name: Validate carrier electrical and labeling contract
        run: node scripts/validate-esp32-carrier-v2.mjs

      - name: Typecheck KiCanvas
        run: npm run lint:types

      - name: Build KiCanvas
        run: npm run build:no-check

      - name: Install KiCad CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli --version

      - name: Run native KiCad DRC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          kicad-cli pcb drc --exit-code-violations --output artifacts/drc.rpt fixtures/esp32_robot_carrier/esp32_robot_carrier_v2.kicad_pcb
          cat artifacts/drc.rpt

      - name: Generate JLCPCB Gerbers and drill files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/gerbers
          kicad-cli pcb gerbers -o artifacts/gerbers/ fixtures/esp32_robot_carrier/esp32_robot_carrier_v2.kicad_pcb
          kicad-cli pcb drill -o artifacts/gerbers/ fixtures/esp32_robot_carrier/esp32_robot_carrier_v2.kicad_pcb
          find artifacts/gerbers -type f -maxdepth 1 -print | sort
          test "$(find artifacts/gerbers -type f | wc -l)" -ge 7
          cp fixtures/esp32_robot_carrier/esp32_robot_carrier_v2.kicad_pcb artifacts/
          sha256sum artifacts/esp32_robot_carrier_v2.kicad_pcb > artifacts/SHA256SUMS.txt

      - name: Upload fabrication validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-carrier-jlcpcb-validation-v2
          path: artifacts
          if-no-files-found: error

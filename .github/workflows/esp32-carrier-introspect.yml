name: Inspect ESP32 carrier fixture

on:
  pull_request:
    paths:
      - 'fixtures/esp32_robot_carrier/**'
      - 'scripts/add-esp32-carrier-v3-battery-sense.mjs'
      - 'scripts/inspect-esp32-carrier-v3-final.mjs'
      - '.github/workflows/esp32-carrier-introspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate final v3 carrier
        run: node scripts/add-esp32-carrier-v3-battery-sense.mjs
      - name: Dump final v3 geometry and connectivity
        run: node scripts/inspect-esp32-carrier-v3-final.mjs

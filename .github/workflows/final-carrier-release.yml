name: Final ESP32 carrier release

on:
  pull_request:
    paths:
      - 'fixtures/esp32_robot_carrier/**'
      - '.github/workflows/final-carrier-release.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact source board
        run: |
          set -euo pipefail
          base64 -d fixtures/esp32_robot_carrier/esp32_robot_carrier_v2.kicad_pcb.gz.b64 | gunzip > /tmp/source.kicad_pcb
          echo 'd76be0c4625d4a34c3e5a09d863da20c15aa4491002270aa1ff017080ce78dda  /tmp/source.kicad_pcb' | sha256sum -c -

      - name: Generate deterministic final board
        run: |
          set -euo pipefail
          python3 fixtures/esp32_robot_carrier/finalize_carrier.py /tmp/source.kicad_pcb /tmp/final.kicad_pcb
          echo '686b09a6266e5d3edecfc5f5abbc6e52e0a90a6290546260cfa0a902212e9f9f  /tmp/final.kicad_pcb' | sha256sum -c -

      - name: Validate carrier contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/final.kicad_pcb').read_text()
          required=[
            'ESP32 ROBOT CARRIER v2','5V INPUT ONLY','5V ONLY - NO 36/42V BATTERY',
            'LEFT HALL A / GPIO16','LEFT HALL B / GPIO17','LEFT HALL C / GPIO36',
            'RIGHT HALL A / GPIO19','RIGHT HALL B / GPIO21','RIGHT HALL C / GPIO22',
            'LEFT ULTRA TRIG / GPIO15','RIGHT ULTRA TRIG / GPIO18','FRONT ULTRA TRIG / GPIO5',
            'LEFT ULTRA ECHO / GPIO35','RIGHT ULTRA ECHO / GPIO39','FRONT ULTRA ECHO / GPIO34',
            'LEFT THROTTLE / GPIO25','RIGHT THROTTLE / GPIO26','LEFT BRAKE / GPIO33','RIGHT BRAKE / GPIO32',
            'LEFT REVERSE / GPIO27','RIGHT REVERSE / GPIO14','SERVO / GPIO13','ARM AUX / GPIO12','ARM AUX / GPIO2',
            'MPU6050 SDA / GPIO4','MPU6050 SCL / GPIO23','RGB LIGHTS','RGB DATA = GPIO2 -> 5V AHCT BUFFER',
            '3V3 RAIL 1','3V3 RAIL 2','3V3 RAIL 3','3V3 RAIL 4','74AHCT1G125','20k','10k'
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'missing required PCB contract items: {missing}'
          nets=set(re.findall(r'\(net\s+"([^"]+)"\)',s))
          nets.update(re.findall(r'\(net\s+\d+\s+"([^"]+)"\)',s))
          for n in [
            '+5V','+3V3','GND',
            'L_BRAKE_GPIO','L_BRAKE_GATE','L_BRAKE_SW','L_BRAKE_CONN',
            'R_BRAKE_GPIO','R_BRAKE_GATE','R_BRAKE_SW','R_BRAKE_CONN',
            'L_REVERSE_GPIO','L_REVERSE_GATE','L_REVERSE_SW','L_REVERSE_CONN',
            'R_REVERSE_GPIO','R_REVERSE_GATE','R_REVERSE_SW','R_REVERSE_CONN'
          ]:
              assert n in nets, f'missing independent channel net {n}'
          qrefs=re.findall(r'\(property "Reference" "(Q\d+)"',s)
          assert len(set(qrefs)) == 4, f'expected 4 unique MOSFETs, found {sorted(set(qrefs))}'
          assert s.count('2N7002') >= 4, 'expected four 2N7002 MOSFET footprints'
          for gpio in ['GPIO33','GPIO32','GPIO27','GPIO14']:
              assert gpio in s, f'missing independent control {gpio}'
          assert '74AHCT1G125' in s, 'missing RGB 5V level shifter'
          print('carrier contract OK, nets',len(nets),'MOSFETs',sorted(set(qrefs)))
          PY

      - name: Install KiCad 10
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y kicad
          kicad-cli --version

      - name: Native KiCad DRC with zone refill
        run: |
          set -euo pipefail
          mkdir -p artifacts
          kicad-cli pcb drc --severity-all --all-track-errors --refill-zones --format json --output artifacts/drc.json /tmp/final.kicad_pcb
          python3 - <<'PY'
          import json
          from collections import Counter
          d=json.load(open('artifacts/drc.json'))
          print('violations',len(d['violations']),'unconnected',len(d['unconnected_items']))
          if d['violations'] or d['unconnected_items']:
              print(Counter(x['type'] for x in d['violations']))
              raise SystemExit(1)
          PY

      - name: Generate fabrication files
        run: |
          set -euo pipefail
          mkdir -p artifacts/gerbers
          cp /tmp/final.kicad_pcb artifacts/esp32_robot_carrier_v2_FINAL.kicad_pcb
          kicad-cli pcb export gerbers --output artifacts/gerbers/ /tmp/final.kicad_pcb
          kicad-cli pcb export drill --output artifacts/gerbers/ /tmp/final.kicad_pcb
          test -n "$(find artifacts/gerbers -type f -name '*.gbr' -print -quit)"
          test -n "$(find artifacts/gerbers -type f \( -name '*.drl' -o -name '*.xln' \) -print -quit)"
          (cd artifacts/gerbers && zip -q ../esp32_robot_carrier_v2_JLCPCB.zip ./*)
          unzip -l artifacts/esp32_robot_carrier_v2_JLCPCB.zip

      - name: Upload manufacturing release
        uses: actions/upload-artifact@v4
        with:
          name: esp32-robot-carrier-v2-JLCPCB-release
          path: artifacts
          if-no-files-found: error

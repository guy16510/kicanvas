name: Format carrier tooling

on:
  pull_request:
    paths:
      - 'scripts/*carrier*.mjs'
      - '.github/workflows/format-carrier-scripts.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Format carrier scripts
        run: npx prettier --write 'scripts/*carrier*.mjs'
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'carrier scripts already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/
          git commit -m 'style: format carrier tooling'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
